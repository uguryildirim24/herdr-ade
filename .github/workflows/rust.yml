name: Rust gates

on: [push, pull_request]

jobs:
  gates:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo build --bin herdr-ade
      - run: node --test tests/pi_extension.test.mjs
      - run: npm install --global @anthropic-ai/claude-code@2.1.287
      - run: claude plugin test mods/coordinator-handoff
      - name: Check changed lines for whitespace errors
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --check "$PR_BASE...HEAD"
          elif [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            git diff --check HEAD^ HEAD
          else
            git diff --check "$BEFORE" HEAD
          fi
