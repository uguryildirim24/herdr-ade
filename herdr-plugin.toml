id = "herdr-ade"
name = "ADE"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "A coordinator conversation, parallel worker threads, shared memory and an overview of what needs you."
platforms = ["macos", "linux"]

# The harness installer owns builds and atomic replacement in ~/.local/bin.
# Explicit shell expansion avoids PATH and checkout build artifacts.
[[startup]]
command = ["/bin/sh", "-c", 'exec "$HOME/.local/bin/herdr-ade" "$@"', "herdr-ade", "ticker", "start"]

[[actions]]
id = "new"
title = "Projects: new project"
contexts = ["workspace"]
command = ["/bin/sh", "-c", 'exec "$HOME/.local/bin/herdr-ade" "$@"', "herdr-ade", "action", "new"]

[[actions]]
id = "open"
title = "Projects: open project"
contexts = ["workspace"]
command = ["/bin/sh", "-c", 'exec "$HOME/.local/bin/herdr-ade" "$@"', "herdr-ade", "action", "open"]

[[actions]]
id = "adopt-workspace"
title = "Projects: continue this workspace as a project"
contexts = ["workspace"]
command = ["/bin/sh", "-c", 'exec "$HOME/.local/bin/herdr-ade" "$@"', "herdr-ade", "action", "adopt-workspace"]

[[actions]]
id = "pause"
title = "Projects: pause project"
contexts = ["workspace"]
command = ["/bin/sh", "-c", 'exec "$HOME/.local/bin/herdr-ade" "$@"', "herdr-ade", "action", "pause"]

[[actions]]
id = "resume"
title = "Projects: resume project"
contexts = ["workspace"]
command = ["/bin/sh", "-c", 'exec "$HOME/.local/bin/herdr-ade" "$@"', "herdr-ade", "action", "resume"]

[[actions]]
id = "doctor"
title = "Projects: check setup"
contexts = ["workspace"]
command = ["/bin/sh", "-c", 'exec "$HOME/.local/bin/herdr-ade" "$@"', "herdr-ade", "action", "doctor"]

[[panes]]
id = "new"
title = "New project"
placement = "popup"
command = ["/bin/sh", "-c", 'exec "$HOME/.local/bin/herdr-ade" "$@"', "herdr-ade", "pane", "new"]

[[panes]]
id = "pick"
title = "Pick a project"
placement = "popup"
command = ["/bin/sh", "-c", 'exec "$HOME/.local/bin/herdr-ade" "$@"', "herdr-ade", "pane", "pick"]

[[panes]]
id = "adopt"
title = "Continue as a project"
placement = "popup"
command = ["/bin/sh", "-c", 'exec "$HOME/.local/bin/herdr-ade" "$@"', "herdr-ade", "pane", "adopt"]

[[panes]]
id = "rundown"
title = "Rundown"
placement = "tab"
command = ["/bin/sh", "-c", 'exec "$HOME/.local/bin/herdr-rundown" "$@"', "herdr-rundown"]
