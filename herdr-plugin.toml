id = "herdr-ade"
name = "ADE"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "A coordinator conversation, parallel worker threads, shared memory and an overview of what needs you."
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[startup]]
command = ["target/release/herdr-ade", "ticker", "start"]

[[actions]]
id = "new"
title = "Projects: new project"
contexts = ["workspace"]
command = ["target/release/herdr-ade", "action", "new"]

[[actions]]
id = "open"
title = "Projects: open project"
contexts = ["workspace"]
command = ["target/release/herdr-ade", "action", "open"]

[[actions]]
id = "overview"
title = "Projects: overview"
contexts = ["workspace"]
command = ["target/release/herdr-ade", "action", "overview"]

[[actions]]
id = "adopt-workspace"
title = "Projects: continue this workspace as a project"
contexts = ["workspace"]
command = ["target/release/herdr-ade", "action", "adopt-workspace"]

[[actions]]
id = "pause"
title = "Projects: pause project"
contexts = ["workspace"]
command = ["target/release/herdr-ade", "action", "pause"]

[[actions]]
id = "resume"
title = "Projects: resume project"
contexts = ["workspace"]
command = ["target/release/herdr-ade", "action", "resume"]

[[actions]]
id = "doctor"
title = "Projects: check setup"
contexts = ["workspace"]
command = ["target/release/herdr-ade", "action", "doctor"]

[[panes]]
id = "overview"
title = "Project overview"
placement = "popup"
command = ["target/release/herdr-ade", "pane", "overview"]

[[panes]]
id = "new"
title = "New project"
placement = "popup"
command = ["target/release/herdr-ade", "pane", "new"]

[[panes]]
id = "pick"
title = "Pick a project"
placement = "popup"
command = ["target/release/herdr-ade", "pane", "pick"]

[[panes]]
id = "adopt"
title = "Continue as a project"
placement = "popup"
command = ["target/release/herdr-ade", "pane", "adopt"]

[[actions]]
id = "pi-doctor"
title = "Pi: check setup"
contexts = ["workspace"]
command = ["target/release/herdr-pi", "doctor"]

[[actions]]
id = "pi-setup"
title = "Pi: install the pinned pi"
contexts = ["workspace"]
command = ["target/release/herdr-pi", "setup"]

[[actions]]
id = "pi-login"
title = "Pi: open a login pane"
contexts = ["workspace"]
command = ["target/release/herdr-pi", "login"]

[[events]]
on = "pane.agent_status_changed"
command = ["target/release/herdr-ade", "event", "round-advance"]
