[package]
name = "herdr-ade"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Projects for herdr: a coordinator conversation, parallel worker threads, shared memory and an overview"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
# Source spans only; no Markdown renderer, CLI, or HTML tree builder.
pulldown-cmark = { version = "0.13", default-features = false }
html5gum = { version = "0.8", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
toml = "0.9"

# Setup, login instructions, doctor and readiness share the library with ADE.
[[bin]]
name = "herdr-pi"
path = "src/bin/herdr-pi.rs"

# Project-bound plan and work view, opened as ADE's bundled Rundown pane.
[[bin]]
name = "herdr-rundown"
path = "src/bin/herdr-rundown.rs"

[dev-dependencies]
regex = "1"
tempfile = "3"
