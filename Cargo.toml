[package]
name = "herdr-ade"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Projects for herdr: a coordinator conversation, parallel worker threads, shared memory and an overview"

[lints.clippy]
# These three already fail `clippy -D warnings` on main at a4cdb0a (unowned
# ticker/lifecycle, and FakeRunner's rule vec). Allowing them here is the
# A0-owned way to keep the gate green without editing those functions.
collapsible_if = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

# The thin pi binary (SPEC-pi v2 §3): setup, login instructions, doctor and
# check. It compiles `src/pi/` through a path attribute; the package keeps
# one library-in-the-binary shape and no separate library target.
[[bin]]
name = "herdr-pi"
path = "src/bin/herdr-pi.rs"

[dev-dependencies]
tempfile = "3"
