# Shipped recipe data. Model and provider choices live here, not in the engine.
# New Pi lanes inherit Linux bubblewrap tool isolation and allowed network.
# Add network = "denied" for untrusted-content work, or execution = "advisory"
# for host work. Mac Pi and native Claude/agy remain advisory. Permission
# bypass below is not a host/credential/network boundary. Doctor reports mode.
[recipes.agy_gemini_flash]
kind = "agy"
provider = "agy"
args = ["--model", "gemini-3.8-flash-high", "--dangerously-skip-permissions"]
plain = "the web research helper"

[recipes.claude_fable_xhigh]
kind = "claude"
provider = "claude"
args = ["--model", "claude-fable-5-1", "--dangerously-skip-permissions", "--effort", "xhigh", "--disallowedTools", "Agent"]
capabilities = ["native-chat"]
plain = "the planning helper"

[recipes.claude_coordinator_opus]
kind = "claude"
provider = "claude"
args = ["--model", "claude-opus-5", "--dangerously-skip-permissions", "--effort", "high", "--disallowedTools", "Agent"]
capabilities = ["native-chat"]
plain = "the planning helper"

[recipes.pi_opencode_deepseek]
kind = "pi"
provider = "opencode-go"
args = ["--provider", "opencode-go", "--model", "deepseek-v4.1-flash", "--thinking", "high", "--no-skills"]
ready_timeout_ms = 300000
plain = "the cheap coding helper"

[recipes.pi_codex_sol_high]
kind = "pi"
provider = "openai-codex"
args = ["--provider", "openai-codex", "--model", "gpt-5.6-sol", "--thinking", "high", "--no-skills"]
ready_timeout_ms = 300000
plain = "the careful number helper"

[recipes.pi_opencode_muse]
kind = "pi"
provider = "opencode-go"
args = ["--provider", "opencode-go", "--model", "muse-spark-1.3-contributor", "--thinking", "high", "--no-skills"]
ready_timeout_ms = 300000
plain = "the second coding helper"

[recipes.claude_journey_probe]
kind = "claude"
provider = "claude"
args = ["--disallowedTools", "Agent", "--model", "claude-haiku-4-5-20251001", "--dangerously-skip-permissions"]
plain = "the throwaway journey probe"
